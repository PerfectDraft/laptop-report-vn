name: Catalog quality audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalogue fields
        run: python scripts/audit_catalog.py --input all_items.json --output reports/data-quality.json
      - name: Check a rotating sample of source links
        run: python scripts/audit_catalog.py --input all_items.json --output reports/link-quality.json --check-links --limit 100
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-quality-report
          path: reports/*.json
          if-no-files-found: error
