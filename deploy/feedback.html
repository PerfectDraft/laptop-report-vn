<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo lỗi hoặc góp ý | Laptop VN</title><style>body{margin:0;background:#0f1420;color:#e8eef7;font:16px system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:#1a2233;border:1px solid #2c3a55;border-radius:16px;padding:20px}label{display:block;margin-top:14px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #41516e;background:#101827;color:#e8eef7;font:inherit}textarea{min-height:140px;resize:vertical}button{background:#4f8cff;border:0;font-weight:700;cursor:pointer}.note{color:#93a3bc;font-size:.88rem;line-height:1.5}.back{color:#7dd3fc}</style></head><body><main class="wrap"><p><a class="back" href="/">← Quay về danh sách laptop</a></p><section class="card"><h1>Báo lỗi hoặc góp ý</h1><p class="note">Thông tin của bạn sẽ được mở thành GitHub Issue để đội dự án kiểm tra công khai. Không nhập thông tin nhạy cảm.</p><form id="feedback"><label>Loại phản hồi<select id="type"><option>Sai giá</option><option>Sai cấu hình</option><option>Link hỏng hoặc sai sản phẩm</option><option>Sai tình trạng hàng</option><option>Thiếu mẫu laptop</option><option>Lỗi giao diện</option><option>Góp ý khác</option></select></label><label>Tên máy hoặc URL liên quan<input id="target" placeholder="Ví dụ: Asus Vivobook... hoặc URL shop"></label><label>Mô tả <textarea id="message" required placeholder="Nêu thông tin đúng, nguồn tham chiếu và cách tái hiện nếu là lỗi giao diện."></textarea></label><button type="submit">Tạo phản hồi</button></form></section></main><script>const p=new URLSearchParams(location.search);target.value=p.get('target')||'';feedback.addEventListener('submit',e=>{e.preventDefault();const type=document.querySelector('#type').value;const body=['## Loại phản hồi',type,'','## Model hoặc URL',target.value||'Chưa cung cấp','','## Mô tả',message.value,'','---','URL trang góp ý: '+location.href].join('\n');location.href='https://github.com/PerfectDraft/laptop-report-vn/issues/new?title='+encodeURIComponent('[Feedback] '+type)+'&body='+encodeURIComponent(body)})</script></body></html>
